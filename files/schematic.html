<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DFU Station wiring schematic</title>
<style>
@page{size:A4 landscape;margin:8mm}
html,body{margin:0;background:#fff}
svg{width:100%;height:auto;display:block}
@media print{svg{width:auto;height:188mm;max-width:100%;margin:0 auto}}
text{font-family:Segoe UI,Arial,sans-serif;fill:#111}
.t{font-size:13px}.s{font-size:11px}.xs{font-size:10px;fill:#444}.h{font-size:15px;font-weight:700}
.title{font-size:20px;font-weight:700}
.box{fill:#fff;stroke:#111;stroke-width:1.6}
.pi{fill:#eef6f8;stroke:#0f5f73;stroke-width:2}
.w{stroke:#111;stroke-width:1.6;fill:none}
.red{stroke:#c62828}.blk{stroke:#111}.blu{stroke:#1565c0}.grn{stroke:#2e7d32}.org{stroke:#ef6c00}.pur{stroke:#6a1b9a}
.dot{fill:#111}
.note{fill:#fff8e1;stroke:#e7c56f}
</style></head><body>
<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="20" y="32" class="title">DFU Thermography Screening Station: wiring schematic</text>
  <text x="20" y="52" class="s">Rev A · 2026-10-28 · Drawn from the station software: src/hardware/gpio.py, src/hardware/sht31.py, config/config.example.yaml (BCM numbering)</text>

  <!-- Raspberry Pi 5 -->
  <rect x="400" y="90" width="300" height="420" rx="10" class="pi"/>
  <text x="550" y="116" text-anchor="middle" class="h">Raspberry Pi 5 (8 GB)</text>
  <text x="550" y="134" text-anchor="middle" class="xs">40-pin header (physical pin · function)</text>
  <!-- header pins, left side labels -->
  <g class="t">
    <text x="412" y="170">1 · 3V3</text>
    <text x="412" y="200">3 · GPIO2 / SDA1</text>
    <text x="412" y="230">5 · GPIO3 / SCL1</text>
    <text x="412" y="260">9 · GND</text>
    <text x="412" y="290">11 · GPIO17</text>
    <text x="412" y="320">13 · GPIO27</text>
    <text x="688" y="290" text-anchor="end">GPIO18 · 12</text>
    <text x="688" y="350" text-anchor="end">GND · 14</text>
  </g>
  <!-- ports -->
  <g class="s">
    <text x="412" y="392">USB 3.0 port</text>
    <text x="412" y="420">CAM/DISP 0 (CSI)</text>
    <text x="412" y="448">PCIe FFC</text>
    <text x="412" y="476">DSI or HDMI</text>
    <text x="412" y="500">USB-C power in</text>
  </g>
  <!-- pin stubs -->
  <g class="dot">
    <circle cx="400" cy="166" r="3.5"/><circle cx="400" cy="196" r="3.5"/><circle cx="400" cy="226" r="3.5"/>
    <circle cx="400" cy="256" r="3.5"/><circle cx="400" cy="286" r="3.5"/><circle cx="400" cy="316" r="3.5"/>
    <circle cx="700" cy="286" r="3.5"/><circle cx="700" cy="346" r="3.5"/>
    <circle cx="400" cy="388" r="3.5"/><circle cx="400" cy="416" r="3.5"/><circle cx="400" cy="444" r="3.5"/>
    <circle cx="400" cy="472" r="3.5"/><circle cx="400" cy="496" r="3.5"/>
  </g>

  <!-- SHT31 -->
  <rect x="40" y="140" width="190" height="130" rx="6" class="box"/>
  <text x="135" y="162" text-anchor="middle" class="h">SHT31 sensor</text>
  <text x="135" y="178" text-anchor="middle" class="xs">temperature / humidity</text><text x="135" y="190" text-anchor="middle" class="xs">I2C bus 1 · address 0x44</text>
  <g class="t"><text x="218" y="200" text-anchor="end">VIN</text><text x="218" y="222" text-anchor="end">SDA</text>
  <text x="218" y="244" text-anchor="end">SCL</text><text x="218" y="264" text-anchor="end">GND</text></g>
  <text x="50" y="230" class="s">ADDR → GND</text><text x="50" y="244" class="xs">(sets 0x44)</text>
  <path d="M230 196 H300 V166 H400" class="w red"/>
  <path d="M230 218 H320 V196 H400" class="w blu"/>
  <path d="M230 240 H340 V226 H400" class="w grn"/>
  <path d="M230 260 H360 V256 H400" class="w blk"/>

  <!-- Capture button -->
  <rect x="40" y="290" width="190" height="70" rx="6" class="box"/>
  <text x="135" y="312" text-anchor="middle" class="h">Capture button</text>
  <text x="135" y="328" text-anchor="middle" class="xs">momentary, normally open</text>
  <text x="135" y="344" text-anchor="middle" class="xs">internal pull-up on, 50 ms debounce</text>
  <path d="M230 304 H300 V286 H400" class="w org"/>
  <path d="M230 346 H250" class="w blk"/><text x="254" y="350" class="s">to GND</text>

  <!-- Status LED -->
  <rect x="40" y="380" width="190" height="90" rx="6" class="box"/>
  <text x="135" y="402" text-anchor="middle" class="h">Status LED</text>
  <text x="135" y="418" text-anchor="middle" class="xs">GPIO27 → R* → LED anode;</text>
  <text x="135" y="432" text-anchor="middle" class="xs">LED cathode → GND</text>
  <text x="135" y="452" text-anchor="middle" class="xs">steady = ready, blink = waiting / fault</text>
  <path d="M230 396 H320 V316 H400" class="w pur"/>
  <path d="M230 460 H250" class="w blk"/><text x="254" y="464" class="s">to GND</text>

  <!-- Interior LED with MOSFET -->
  <rect x="780" y="140" width="325" height="270" rx="6" class="box"/>
  <text x="942" y="162" text-anchor="middle" class="h">Interior LED (colour frame light)</text>
  <text x="942" y="178" text-anchor="middle" class="xs">switched low-side by an N-channel logic-level MOSFET*</text>
  <!-- supply and LED -->
  <text x="1000" y="206" class="s">LED supply +V*</text>
  <path d="M990 200 V222" class="w red"/>
  <rect x="960" y="222" width="60" height="34" rx="4" class="box"/>
  <text x="990" y="244" text-anchor="middle" class="s">LED*</text>
  <path d="M990 256 V276" class="w blk"/>
  <text x="1000" y="274" class="xs">drain</text>
  <!-- mosfet symbol -->
  <rect x="965" y="276" width="50" height="44" rx="4" class="box"/>
  <text x="990" y="302" text-anchor="middle" class="s">Q1*</text>
  <path d="M990 320 V346" class="w blk"/><text x="1000" y="340" class="xs">source</text>
  <text x="1000" y="360" class="s">GND (common)</text>
  <!-- gate -->
  <path d="M700 286 H860" class="w org"/>
  <rect x="860" y="278" width="44" height="16" class="box"/><text x="882" y="272" text-anchor="middle" class="xs">R gate*</text>
  <path d="M904 286 H965" class="w org"/><text x="930" y="306" text-anchor="middle" class="xs">gate</text>
  <text x="792" y="388" class="xs">Pull-down R* from gate to GND recommended,</text><text x="792" y="401" class="xs">so the LED stays off while the Pi boots.</text>
  <text x="792" y="214" class="xs">Software: active-high,</text><text x="792" y="227" class="xs">off at start and on exit.</text>
  <path d="M700 346 H760 V360 H990" class="w blk"/>

  <!-- Ports to devices -->
  <rect x="40" y="540" width="250" height="60" rx="6" class="box"/>
  <text x="165" y="562" text-anchor="middle" class="h">FLIR Lepton 3.5</text>
  <text x="165" y="580" text-anchor="middle" class="xs">seated in GroupGets PureThermal 3</text>
  <text x="165" y="594" text-anchor="middle" class="xs">USB UVC camera · Y16 radiometric</text>
  <path d="M290 570 H330 V388 H400" class="w blk"/>

  <rect x="40" y="620" width="250" height="50" rx="6" class="box"/>
  <text x="165" y="642" text-anchor="middle" class="h">Camera Module 3</text>
  <text x="165" y="660" text-anchor="middle" class="xs">CSI ribbon · focus fixed for 420 mm</text>
  <path d="M290 645 H350 V416 H400" class="w blk"/>

  <rect x="420" y="560" width="250" height="50" rx="6" class="box"/>
  <text x="545" y="582" text-anchor="middle" class="h">AI HAT+ (Hailo-8L)</text>
  <text x="545" y="600" text-anchor="middle" class="xs">PCIe FFC · stacking header passes GPIO through</text>
  <path d="M400 444 H370 V585 H420" class="w blk"/>

  <rect x="420" y="630" width="250" height="50" rx="6" class="box"/>
  <text x="545" y="652" text-anchor="middle" class="h">7-inch touchscreen</text>
  <text x="545" y="670" text-anchor="middle" class="xs">DSI ribbon or HDMI</text>
  <path d="M400 472 H380 V655 H420" class="w blk"/>

  <rect x="420" y="700" width="250" height="44" rx="6" class="box"/>
  <text x="545" y="720" text-anchor="middle" class="h">27 W USB-C power supply</text>
  <text x="545" y="736" text-anchor="middle" class="xs">official Pi 5 supply</text>
  <path d="M400 496 H390 V722 H420" class="w red"/>

  <!-- Notes -->
  <rect x="720" y="430" width="370" height="250" rx="8" class="note"/>
  <text x="736" y="454" class="h">Notes</text>
  <g class="s">
    <text x="736" y="478">* Not recorded in the project. Confirm on the unit and</text>
    <text x="736" y="494">   write the values here: LED supply voltage, LED type,</text>
    <text x="736" y="510">   MOSFET part, gate, pull-down and status LED resistors.</text>
    <text x="736" y="534">All grounds are common. GPIO is 3.3 V: never connect</text>
    <text x="736" y="550">the LED supply to a GPIO pin.</text>
    <text x="736" y="574">Pins can be changed in config/config.yaml (gpio: and</text>
    <text x="736" y="590">ambient:). If they change, update this drawing.</text>
    <text x="736" y="614">The Lepton is the measurement camera; the colour camera</text>
    <text x="736" y="630">and interior LED are for the colour frame only.</text>
    <text x="736" y="654">Wire colours on this drawing are for reading only.</text>
  </g>
  <text x="1100" y="770" text-anchor="end" class="xs">eMathrix Technologies · Contract EMX-2026-DFUSCAN-01</text>
</svg>
</body></html>
